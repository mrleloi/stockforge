    - id: V2
      check: "Every .claude/agents/*.md path appears in exactly one layer"
      severity: error
    - id: V3
      check: "Every .claude/commands/*.md path appears in exactly one layer"
      severity: error
    - id: V4
      check: "Every scripts/hooks/*.sh + scripts/hooks/*.ps1 path appears in exactly one layer"
      severity: error
    - id: V5
      check: "Every path in attach.default_includes exists OR is a directory pattern"
      severity: warning
