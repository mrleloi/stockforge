# Layer Manifest — Track 5.5a (Phase 0 Harness Bootstrap)
#
# Source decision: agent-workspace/memory/decisions/003-up06-track-5.5-sync-layer-selfcap.md § 5.5a
# Per UP-06 §2: clear layer separation enables /attach skill (port harness to new project),
# multi-project peers via git fork, and drift detection of scope alignment.
#
# Multi-tenant SKIPPED per UP-06 Q6=D — single-human assumption.
#
# Categorization rule:
# - harness     = portable pattern; project-agnostic; copy via /attach
# - stockforge  = biz-specific; stays with this fork; not copied by /attach
# - personal    = per-user customization; gitignored; opt-in via /attach --include-personal
# - hybrid      = split-internally (harness baseline + project override)
# - needs-refactor = currently entangled with stockforge; pattern is portable; refactor target

version: 1
revision: REV-3
created_at: 2026-04-29
updated_at: 2026-05-05
revision_history:
  - REV-1 (2026-04-29): initial layer separation
  - REV-2 (2026-04-29 S5-cont): tag-only IMPL refinement (no physical move)
  - REV-3 (2026-05-05 S48b HH-A.5): regen — tag 35 artifacts that accumulated since REV-2 (7 skills + 2 agents + 1 command + 25 hooks); restore V1/V2/V3/V4 invariant exactly-one-layer membership
schema_url: ./manifest.schema.json    # NEW (S6 will author validator)

description: |
  Declares scope of every artifact in .claude/ + scripts/hooks/ + select root files.
  Read by /attach skill at copy time + drift-signals at audit time.
  Single source of truth for "what is portable harness vs what is stockforge biz".

  REV-2 (2026-04-29, S5-continuation): layer separation is LOGICAL via manifest tags, NOT PHYSICAL.
  Stockforge biz skills stay co-located with harness skills under `.claude/skills/`; tagging in
  this manifest determines layer membership. Preserves Claude Code Skill tool auto-discovery.
  See `agent-workspace/memory/decisions/003-up06-track-5.5-sync-layer-selfcap.md § REV-2` for
  rationale (Q&A audit: human-workspace/q-and-a/pending/2026-04-29-005-track-5.5a-layer-realization.md).

