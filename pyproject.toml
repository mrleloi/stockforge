[project]
name = "stockforge"
version = "0.0.1"
description = "AI-first investment advisor for Vietnamese stock market"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    # --- Core runtime ---
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",                  # infrastructure/interfaces only — NOT domain
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",

    # --- Data layer ---
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.0.0",
    "duckdb>=1.0.0",
    "pgvector>=0.3.0",

    # --- Data science ---
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",

    # --- Backtesting / finance ---
    "vnstock>=3.2.0",                   # VN market data
    "yfinance>=0.2.40",                 # global comparables

    # --- Vietnamese NLP ---
    "pyvi==0.1.1",                       # VN tokenizer (MIT; STEP 0 eval S362 sub-plan 029; S363 F2 exact-pin per ADR D-070 RM2 promise)

    # --- Scraping ---
    "beautifulsoup4>=4.12.0",
    "playwright>=1.47.0",               # JS-heavy sites
    "feedparser>=6.0.0",                # RSS
    "yt-dlp>=2024.10.0",                # YouTube
    "tenacity>=9.0.0",                  # retry/backoff for KOL adapters (BC-6 S46)
    "protego>=0.3.1",                   # robots.txt parser (BC-5 RobotsTxtManager D2 plan-020)

    # --- Transcription ---
    "openai-whisper>=20240930",         # local Whisper
    "pydub>=0.25.0",

    # --- HTTP framework (infrastructure/API layer only) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # --- Dashboard ---
    "streamlit>=1.40.0",
    "plotly>=5.24.0",

    # --- Task queue / scheduler ---
    "dramatiq[redis]>=1.17.0",
    "prefect>=3.0.0",

    # --- Cloud storage ---
    "boto3>=1.35.0",                    # R2 (S3-compatible)

    # --- CLI ---
    "click>=8.1.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.115.0",
    "faker>=30.0.0",
    "freezegun>=1.5.0",
    "respx>=0.21.0",                    # httpx mocking for KOL adapter tests (BC-6 S46)
    "import-linter>=2.1.0",             # enforce architecture boundaries
    "pre-commit>=4.0.0",
]

[tool.uv.workspace]
# Monorepo-style workspace packages
members = ["packages/*", "apps/*"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_explicit = true            # I-12: no Any in domain
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["packages.domain.*"]
disallow_any_explicit = true
disallow_any_generics = true

[[tool.mypy.overrides]]
# Phase G.1 one-off PDF bake-off probe: optional deps (pdfplumber, docling, pypdf)
# are NOT in pyproject.toml (isolated-venv probe per DD-8 plan-041 § D3).
# Allow missing imports + untyped calls; warn_unused_ignores off for probe-tier.
module = ["apps.cli.bench.pdf_bake_off"]
ignore_missing_imports = true
disallow_any_explicit = false
warn_unused_ignores = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle, pyflakes
    "I",                    # isort
    "UP",                   # pyupgrade
    "B",                    # bugbear
    "SIM",                  # simplify
    "ARG",                  # unused arguments
    "TID",                  # tidy imports
    "T20",                  # no print (I-13)
]
ignore = [
    "E501",                 # line length — ruff formatter handles
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]   # prints ok in tests

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages", "apps", "tests"]
python_files = ["test_*.py", "*_test.py"]
# importmode=importlib avoids duplicate-module collision between packages/_shared
# and apps/_shared (both named _shared under pytest's default prepend mode).
# Required by plan 020 (S338) to include apps/_shared/crawl/ tests in the suite.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests",
    "integration: requires DB/Redis",
    "backtest: historical replay tests",
    "llm: requires LLM API (expensive)",
    "slow: slow tests, excluded from default run",
]

[tool.importlinter]
root_packages = ["packages"]

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "packages.interfaces",
    "packages.application",
    "packages.domain",
    "packages.infrastructure",
]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "Domain has no framework dependencies"
type = "forbidden"
source_modules = ["packages.domain"]
forbidden_modules = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "redis",
    "anthropic",
    "openai",
    "httpx",
]

# Bounded-context independence (S35 D6 — promotes L-S34-1 cross-BC import-detection lesson).
# Each BC must NOT directly import another BC's domain layer; cross-BC communication
# goes via packages.contracts.events / packages.contracts.protocols only.
# Surfaced S34 mid-session refactor: peer_service originally imported VN30_UNIVERSE
# from market_data BC — caught manually, not by mypy/ruff/Clean-Architecture-layers contract.
[[tool.importlinter.contracts]]
name = "Bounded contexts are independent"
type = "independence"
modules = [
    "packages.domain.market_data",
    "packages.domain.fundamental",
    "packages.domain.news",
    "packages.domain.crowd",
    "packages.domain.influence",
    "packages.domain.macro",
    "packages.domain.portfolio",
    "packages.domain.company_intelligence",
    "packages.domain.analysis",
]
# Tests are composition-layer; allow them to cross-BC for fixture/constants reuse.
# Production-code violations are the binding signal (L-S34-1 motivation).
ignore_imports = [
    "packages.domain.fundamental.test_services -> packages.domain.market_data.value_objects",
]
